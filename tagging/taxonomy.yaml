# ============================================================
# NexusAuth Tagging Taxonomy
# Single source of truth for document classification
# Version: 2.0.0  (moat expansion — 18 document types)
# ============================================================

# ─────────────────────────────────────────────────────────────
# DOCUMENT TYPE DEFINITIONS
# 18 canonical document types with keyword triggers
# ─────────────────────────────────────────────────────────────
document_types:

  # ── NexusAuth-routed ──────────────────────────────────────

  prior_auth_criteria:
    label: "Prior Authorization Criteria"
    description: "Payer-specific criteria for prior authorization decisions"
    keywords:
      - "prior authorization"
      - "prior auth"
      - "pre-authorization"
      - "preauthorization"
      - "medical necessity criteria"
      - "coverage criteria"
      - "authorization required"
      - "prior approval"
      - "PA criteria"
      - "clinical indications"
      - "coverage policy"
    weight: 1.5

  lcd:
    label: "Local Coverage Determination"
    description: "CMS LCD documents defining Medicare coverage at the MAC level"
    keywords:
      - "local coverage determination"
      - "LCD"
      - "L3"
      - "MAC jurisdiction"
      - "medicare administrative contractor"
      - "local coverage"
      - "noridian"
      - "palmetto"
      - "novitas"
      - "CGS administrators"
      - "first coast"
      - "NGS"
      - "WPS"
      - "CGS"
    weight: 2.0

  ncd:
    label: "National Coverage Determination"
    description: "CMS NCD documents defining Medicare coverage nationally"
    keywords:
      - "national coverage determination"
      - "NCD"
      - "national coverage"
      - "medicare coverage"
      - "CMS coverage"
      - "section 1862"
    weight: 2.0

  clinical_policy:
    label: "Clinical Policy Bulletin"
    description: "Payer clinical policy bulletins (CPBs) and medical policies"
    keywords:
      - "clinical policy bulletin"
      - "CPB"
      - "medical policy"
      - "clinical policy"
      - "coverage policy bulletin"
      - "benefit policy"
      - "aetna clinical policy"
      - "uhc medical policy"
      - "bcbs medical policy"
      - "cigna coverage policy"
      - "humana medical policy"
    weight: 1.3

  coverage_determination:
    label: "Coverage Determination"
    description: "General coverage determinations and benefit decisions"
    keywords:
      - "coverage determination"
      - "benefit determination"
      - "coverage decision"
      - "covered service"
      - "non-covered service"
      - "excluded service"
      - "benefit exclusion"
    weight: 1.2

  medical_necessity_policy:
    label: "Medical Necessity Policy"
    description: "Evidence-based medical necessity and utilization management criteria"
    keywords:
      - "medical necessity policy"
      - "clinical criteria"
      - "InterQual"
      - "MCG criteria"
      - "Milliman"
      - "evidence-based criteria"
      - "appropriateness criteria"
      - "utilization management"
      - "level of care criteria"
      - "admission criteria"
      - "continued stay criteria"
      - "clinical decision support"
    weight: 1.6

  icd10_guidelines:
    label: "ICD-10 Coding Guidelines"
    description: "Official ICD-10-CM/PCS coding guidelines and annual updates"
    keywords:
      - "ICD-10-CM guidelines"
      - "ICD-10-PCS guidelines"
      - "official coding guidelines"
      - "principal diagnosis"
      - "code first"
      - "code also"
      - "etiology/manifestation"
      - "outpatient coding"
      - "inpatient coding"
      - "present on admission"
      - "POA indicator"
      - "sequela"
      - "combination code"
      - "FY 2026"
      - "fiscal year coding update"
      - "section I guidelines"
      - "section II guidelines"
    weight: 1.4

  transmittal:
    label: "CMS Transmittal / Change Request"
    description: "CMS program transmittals and change requests updating policy"
    keywords:
      - "CMS transmittal"
      - "change request"
      - "CR number"
      - "program memorandum"
      - "manual update"
      - "one-time notification"
      - "effective date of implementation"
      - "Medicare Claims Processing Manual"
      - "Medicare Benefit Policy Manual"
      - "Medicare Program Integrity Manual"
      - "Internet Only Manual"
      - "IOM update"
    weight: 1.2

  # ── CODEMED-routed ────────────────────────────────────────

  fee_schedule:
    label: "Fee Schedule"
    description: "Payer fee schedules and reimbursement rate tables"
    keywords:
      - "fee schedule"
      - "reimbursement rate"
      - "payment rate"
      - "allowable amount"
      - "physician fee schedule"
      - "MPFS"
      - "conversion factor"
      - "RVU"
      - "relative value unit"
      - "facility rate"
      - "non-facility rate"
      - "payment amount"
      - "work RVU"
      - "practice expense RVU"
      - "malpractice RVU"
      - "total RVU"
      - "geographic practice cost index"
      - "GPCI"
    weight: 1.5

  billing_guidelines:
    label: "Billing Guidelines"
    description: "Coding and billing guidelines for claims submission"
    keywords:
      - "billing guidelines"
      - "coding guidelines"
      - "claims submission"
      - "modifier"
      - "place of service"
      - "revenue code"
      - "UB-04"
      - "CMS-1500"
      - "NCCI"
      - "correct coding initiative"
      - "bundling"
      - "unbundling"
    weight: 1.3

  formulary:
    label: "Drug Formulary"
    description: "Payer drug formularies and pharmacy benefit lists"
    keywords:
      - "formulary"
      - "drug list"
      - "preferred drug"
      - "tier 1"
      - "tier 2"
      - "tier 3"
      - "pharmacy benefit"
      - "step therapy"
      - "quantity limit"
      - "prior auth drug"
      - "specialty drug"
    weight: 1.4

  ncci_edit:
    label: "NCCI Edit"
    description: "CMS NCCI procedure-to-procedure edits and medically unlikely edits"
    keywords:
      - "NCCI"
      - "correct coding initiative"
      - "procedure-to-procedure"
      - "PTP edit"
      - "column 1"
      - "column 2"
      - "medically unlikely edit"
      - "MUE"
      - "edit pair"
      - "modifier indicator"
      - "unbundling"
      - "bundled code"
      - "column 2 code"
      - "mutually exclusive"
      - "comprehensive code"
      - "component code"
    weight: 1.8

  remittance_policy:
    label: "Remittance / Denial Code Policy"
    description: "CARC and RARC denial codes and remittance advice explanations"
    keywords:
      - "claim adjustment reason code"
      - "CARC"
      - "remittance advice remark code"
      - "RARC"
      - "denial code"
      - "remark code"
      - "CO-"
      - "PR-"
      - "OA-"
      - "PI-"
      - "claim adjustment"
      - "payer adjustment"
      - "contractual obligation"
      - "patient responsibility"
      - "other adjustment"
      - "N-code"
      - "M-code"
      - "ERA 835"
    weight: 1.4

  modifier_policy:
    label: "Modifier Policy"
    description: "CPT/HCPCS modifier rules and usage policies"
    keywords:
      - "modifier -25"
      - "modifier -59"
      - "modifier -TC"
      - "modifier -26"
      - "modifier -51"
      - "modifier -57"
      - "modifier XE"
      - "modifier XS"
      - "modifier XP"
      - "modifier XU"
      - "global period"
      - "global surgery"
      - "distinct procedural service"
      - "significant separate"
      - "professional component"
      - "technical component"
      - "modifier appended"
      - "modifier use"
      - "modifier definition"
    weight: 1.5

  drg_policy:
    label: "MS-DRG Policy"
    description: "Medicare Severity DRG weights, grouper rules, and IPPS payment"
    keywords:
      - "MS-DRG"
      - "diagnosis related group"
      - "DRG weight"
      - "geometric mean LOS"
      - "arithmetic mean LOS"
      - "IPPS"
      - "inpatient prospective payment"
      - "CC/MCC"
      - "major complication"
      - "comorbidity"
      - "relative weight"
      - "MDC"
      - "major diagnostic category"
      - "DRG grouper"
      - "fiscal year DRG"
      - "base payment rate"
      - "wage index"
    weight: 1.6

  opps_apc:
    label: "OPPS / APC Payment"
    description: "Outpatient Prospective Payment System APC rates and addenda"
    keywords:
      - "APC"
      - "ambulatory payment classification"
      - "OPPS"
      - "outpatient prospective payment"
      - "status indicator"
      - "addendum A"
      - "addendum B"
      - "pass-through payment"
      - "outpatient payment rate"
      - "hospital outpatient"
      - "packaging"
      - "composite APC"
      - "comprehensive APC"
      - "device-intensive"
    weight: 1.6

  asp_drug_pricing:
    label: "ASP Drug Pricing"
    description: "CMS Average Sales Price quarterly drug reimbursement rates"
    keywords:
      - "average sales price"
      - "ASP"
      - "J-code pricing"
      - "Part B drug"
      - "drug reimbursement rate"
      - "quarterly update"
      - "WAC"
      - "wholesale acquisition cost"
      - "ASP+6%"
      - "buy and bill"
      - "drug payment limit"
      - "Part B drug payment"
      - "infusion drug"
      - "injectable drug"
    weight: 1.5

  unknown:
    label: "Unknown / Unclassified"
    description: "Documents that could not be confidently classified"
    keywords: []
    weight: 0.0


