# ─────────────────────────────────────────────────────────────
# ROUTING MATRIX
# Maps document type → target tool(s)
# ─────────────────────────────────────────────────────────────
routing_matrix:
  # NexusAuth: clinical coverage, criteria, policy
  prior_auth_criteria:
    targets: ["NexusAuth"]
    priority: "high"
  lcd:
    targets: ["NexusAuth"]
    priority: "high"
  ncd:
    targets: ["NexusAuth"]
    priority: "high"
  clinical_policy:
    targets: ["NexusAuth"]
    priority: "medium"
  coverage_determination:
    targets: ["NexusAuth"]
    priority: "medium"
  medical_necessity_policy:
    targets: ["NexusAuth"]
    priority: "high"
  icd10_guidelines:
    targets: ["NexusAuth"]
    priority: "medium"
  transmittal:
    targets: ["NexusAuth"]
    priority: "low"
  # CODEMED: billing, coding, payment
  fee_schedule:
    targets: ["CODEMED"]
    priority: "high"
  billing_guidelines:
    targets: ["CODEMED"]
    priority: "high"
  formulary:
    targets: ["CODEMED"]
    priority: "medium"
  ncci_edit:
    targets: ["CODEMED"]
    priority: "high"
  remittance_policy:
    targets: ["CODEMED"]
    priority: "high"
  modifier_policy:
    targets: ["CODEMED"]
    priority: "high"
  drg_policy:
    targets: ["CODEMED"]
    priority: "high"
  opps_apc:
    targets: ["CODEMED"]
    priority: "high"
  asp_drug_pricing:
    targets: ["CODEMED"]
    priority: "high"
  unknown:
    targets: ["REVIEW"]
    priority: "low"


# ─────────────────────────────────────────────────────────────
# CONFIDENCE THRESHOLDS
# ─────────────────────────────────────────────────────────────
confidence_thresholds:
  auto_accept: 0.75      # >= 0.75 → accept classification automatically
  review_required: 0.40  # 0.40–0.74 → flag for human review
  reject: 0.40           # < 0.40 → classify as 'unknown', flag for review
