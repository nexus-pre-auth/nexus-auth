name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

env:
  # Offline mode: no real DB, Redis, OpenAI, or Stripe keys needed for tests
  DATABASE_URL: "postgresql://nexusauth:nexusauth@localhost:5432/nexusauth"
  REDIS_URL: ""
  OPENAI_API_KEY: "sk-test-placeholder"
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_test_placeholder"
  CODEMED_API_KEYS: "ci-test-key"
  CODEMED_ENV: "development"
  LOG_LEVEL: "WARNING"

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest-cov

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest tests/ -q --tb=short --cov=codemed --cov=billing --cov=ingestion --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t codemed-api:ci .

      - name: Build demo image (if Dockerfile.demo exists)
        run: |
          if [ -f Dockerfile.demo ]; then
            docker build -t codemed-demo:ci -f Dockerfile.demo .
          else
            echo "Dockerfile.demo not found, skipping"
          fi
