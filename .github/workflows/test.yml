name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Stress Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline — no DB or OpenAI key needed)
        run: |
          pytest tests/ \
            -k "not integration" \
            -q \
            --tb=short \
            --cov=ingestion \
            --cov=tagging \
            --cov=api \
            --cov-report=term-missing
